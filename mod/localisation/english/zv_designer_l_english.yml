 zv_engine_inline_1:0 "Inline engine I"
 zv_engine_inline_1_desc:0 "Less powerful than the V, but lighter, slimmer and cheaper: it keeps some agility."
 zv_engine_config_nose_a:0 "Single nose engine — class A"
 zv_engine_config_nose_a_desc:0 "Reference: the vanilla single engine. Thrust factor ×1.0, 1 engine."
 zv_engine_config_twin_wing_a:0 "Twin engine (wings) — class A"
 zv_engine_config_twin_wing_a_desc:0 "Bf 110, He 111, Me 262, P-38. One engine can fail without losing the aircraft (reliability). Free on small airframes: there is no twin-engine fuselage. Thrust factor ×1.55, 2 engines."
 zv_role_fighter_small:0 "Fighter (S)"
 zv_role_fighter_small_desc:0 "No role stats."
 zv_light_mg_2x:0 "Light machine guns x2"
 zv_light_mg_2x_desc:0 "7.5 to 7.92 mm: light, little stopping power."
 zv_engine_v_1:0 "V engine I"
 zv_engine_v_1_desc:0 "The most powerful and most streamlined piston engine; vulnerable glycol circuit and delicate mechanics."
 zv_engine_v_2:0 "V engine II"
 zv_engine_v_2_desc:0 "The most powerful and most streamlined piston engine; vulnerable glycol circuit and delicate mechanics."
 zv_engine_v_3:0 "V engine III"
 zv_engine_v_3_desc:0 "The most powerful and most streamlined piston engine; vulnerable glycol circuit and delicate mechanics."
 zv_engine_v_4:0 "V engine IV"
 zv_engine_v_4_desc:0 "The most powerful and most streamlined piston engine; vulnerable glycol circuit and delicate mechanics."
 zv_engine_inline_2:0 "Inline engine II"
 zv_engine_inline_2_desc:0 "Less powerful than the V, but lighter, slimmer and cheaper: it keeps some agility."
 zv_engine_inline_3:0 "Inline engine III"
 zv_engine_inline_3_desc:0 "Less powerful than the V, but lighter, slimmer and cheaper: it keeps some agility."
 zv_engine_inline_4:0 "Inline engine IV"
 zv_engine_inline_4_desc:0 "Less powerful than the V, but lighter, slimmer and cheaper: it keeps some agility."
 zv_engine_radial_1:0 "Radial engine I"
 zv_engine_radial_1_desc:0 "As powerful as the V, takes hits (no coolant) and rarely breaks down; its large frontal area slows the aircraft, which the NACA cowling partly offsets."
 zv_engine_radial_2:0 "Radial engine II"
 zv_engine_radial_2_desc:0 "As powerful as the V, takes hits (no coolant) and rarely breaks down; its large frontal area slows the aircraft, which the NACA cowling partly offsets."
 zv_engine_radial_3:0 "Radial engine III"
 zv_engine_radial_3_desc:0 "As powerful as the V, takes hits (no coolant) and rarely breaks down; its large frontal area slows the aircraft, which the NACA cowling partly offsets."
 zv_engine_radial_4:0 "Radial engine IV"
 zv_engine_radial_4_desc:0 "As powerful as the V, takes hits (no coolant) and rarely breaks down; its large frontal area slows the aircraft, which the NACA cowling partly offsets."
 zv_engine_rotary_1:0 "Rotary engine I"
 zv_engine_rotary_1_desc:0 "Light and lively, but the crankcase spinning with the propeller limits revs: thrust tops out around 14 and total-loss oiling ruins reliability. Dead-end branch, kept for those who want to play it."
 zv_engine_rotary_2:0 "Rotary engine II"
 zv_engine_rotary_2_desc:0 "Light and lively, but the crankcase spinning with the propeller limits revs: thrust tops out around 14 and total-loss oiling ruins reliability. Dead-end branch, kept for those who want to play it."
 zv_engine_rotary_3:0 "Rotary engine III"
 zv_engine_rotary_3_desc:0 "Light and lively, but the crankcase spinning with the propeller limits revs: thrust tops out around 14 and total-loss oiling ruins reliability. Dead-end branch, kept for those who want to play it."
 zv_engine_rotary_4:0 "Rotary engine IV"
 zv_engine_rotary_4_desc:0 "Light and lively, but the crankcase spinning with the propeller limits revs: thrust tops out around 14 and total-loss oiling ruins reliability. Dead-end branch, kept for those who want to play it."
 zv_engine_flat_1:0 "Flat engine I (small displacement)"
 zv_engine_flat_1_desc:0 "Light aircraft engine (liaison, training): very reliable and economical, too weak for a combat aircraft."
 zv_engine_flat_2:0 "Flat engine II (large displacement)"
 zv_engine_flat_2_desc:0 "Bigger version for late observation and liaison aircraft."
 zv_engine_diesel_1:0 "Diesel I (Jumo 205 type)"
 zv_engine_diesel_1_desc:0 "Uses little fuel and flies far, but heavy and weak at altitude."
 zv_engine_diesel_2:0 "Diesel II (high altitude, Jumo 207 type)"
 zv_engine_diesel_2_desc:0 "Turbocharged diesel for high-altitude reconnaissance (Ju 86P)."
 zv_engine_pulsejet:0 "Pulsejet (Argus type)"
 zv_engine_pulsejet_desc:0 "Simple and cheap, but it vibrates, burns a huge amount of fuel and only pushes well at high speed. Dead-end branch."
 zv_engine_centrifugal_1:0 "Centrifugal turbojet I (Whittle type)"
 zv_engine_centrifugal_1_desc:0 "First jet engine (Meteor F.1): no faster than a good 1944 piston engine, thirsty and fragile; it paves the way for later jets."
 zv_engine_centrifugal_2:0 "Centrifugal turbojet II"
 zv_engine_centrifugal_2_desc:0 "Mature centrifugal jet (Nene, Derwent V): reliable for a jet, but wide."
 zv_engine_axial_1:0 "Axial turbojet I (Jumo 004 type)"
 zv_engine_axial_1_desc:0 "Slim and fast, but its very short service life and heat-resistant alloys (chromium) make it unreliable and expensive in resources."
 zv_engine_axial_2:0 "Axial turbojet II (post-war)"
 zv_engine_axial_2_desc:0 "Post-war generation: the best thrust in the mod. Far-off technology."
 zv_engine_turboprop:0 "Turboprop"
 zv_engine_turboprop_desc:0 "A turbine driving a propeller: jet thrust, range close to a piston engine, intermediate speed. Keeps the propeller slot. Far-off technology."
 zv_engine_rocket_1:0 "Rocket engine 1"
 zv_engine_rocket_1_desc:0 "Blistering climb, for interception only; a few minutes of propulsion (collapsed range) and dangerous propellants (reliability). Allowed configurations: tail engine, twin, four and six wing engines; no air intake."
 zv_engine_rocket_2:0 "Rocket engine 2"
 zv_engine_rocket_2_desc:0 "Blistering climb, for interception only; a few minutes of propulsion (collapsed range) and dangerous propellants (reliability). Allowed configurations: tail engine, twin, four and six wing engines; no air intake."
 zv_engine_rocket_3:0 "Rocket engine 3"
 zv_engine_rocket_3_desc:0 "Blistering climb, for interception only; a few minutes of propulsion (collapsed range) and dangerous propellants (reliability). Allowed configurations: tail engine, twin, four and six wing engines; no air intake."
 zv_engine_config_nose_b:0 "Single nose engine — class B"
 zv_engine_config_nose_b_desc:0 "Like version A, for class B engines (15 IC per engine)."
 zv_engine_config_nose_c:0 "Single nose engine — class C"
 zv_engine_config_nose_c_desc:0 "Like version A, for class C engines (18 IC per engine)."
 zv_engine_config_twin_wing_b:0 "Twin engine (wings) — class B"
 zv_engine_config_twin_wing_b_desc:0 "Like version A, for class B engines (15 IC per engine)."
 zv_engine_config_twin_wing_c:0 "Twin engine (wings) — class C"
 zv_engine_config_twin_wing_c_desc:0 "Like version A, for class C engines (18 IC per engine)."
 zv_engine_config_twin_wing_d:0 "Twin engine (wings) — class D"
 zv_engine_config_twin_wing_d_desc:0 "Like version A, for class D engines (22 IC per engine)."
 zv_engine_config_tri_a:0 "Trimotor (wings + nose) — class A"
 zv_engine_config_tri_a_desc:0 "Ju 52, SM.79: redundant, but heavy to handle (three engine masses) and the nose engine takes the place of the nose station. Thrust factor ×2.05, 3 engines."
 zv_engine_config_tri_b:0 "Trimotor (wings + nose) — class B"
 zv_engine_config_tri_b_desc:0 "Like version A, for class B engines (15 IC per engine)."
 zv_engine_config_tri_c:0 "Trimotor (wings + nose) — class C"
 zv_engine_config_tri_c_desc:0 "Like version A, for class C engines (18 IC per engine)."
 zv_engine_config_quad_a:0 "Four engines (2 × wings) — class A"
 zv_engine_config_quad_a_desc:0 "B-17, Lancaster: the heavy bomber configuration. Thrust factor ×2.6, 4 engines."
 zv_engine_config_quad_b:0 "Four engines (2 × wings) — class B"
 zv_engine_config_quad_b_desc:0 "Like version A, for class B engines (15 IC per engine)."
 zv_engine_config_quad_c:0 "Four engines (2 × wings) — class C"
 zv_engine_config_quad_c_desc:0 "Like version A, for class C engines (18 IC per engine)."
 zv_engine_config_quad_d:0 "Four engines (2 × wings) — class D"
 zv_engine_config_quad_d_desc:0 "Like version A, for class D engines (22 IC per engine)."
 zv_engine_config_quad_tandem_a:0 "Four engines in tandem (2 per wing, one behind the other) — class A"
 zv_engine_config_quad_tandem_a_desc:0 "Do 26, Do 18: two nacelles instead of four (less drag), but the rear propeller turns in the wash of the front one (thrust −8%) and the rear engine runs hot. Thrust factor ×2.4, 4 engines."
 zv_engine_config_quad_tandem_b:0 "Four engines in tandem (2 per wing, one behind the other) — class B"
 zv_engine_config_quad_tandem_b_desc:0 "Like version A, for class B engines (15 IC per engine)."
 zv_engine_config_quad_tandem_c:0 "Four engines in tandem (2 per wing, one behind the other) — class C"
 zv_engine_config_quad_tandem_c_desc:0 "Like version A, for class C engines (18 IC per engine)."
 zv_engine_config_quint_a:0 "Five engines (nose + 2 × wings) — class A"
 zv_engine_config_quint_a_desc:0 "He 111 Z: rare; more thrust than a four-engine aircraft, at the cost of drag and an occupied nose. Thrust factor ×3.1, 5 engines."
 zv_engine_config_quint_b:0 "Five engines (nose + 2 × wings) — class B"
 zv_engine_config_quint_b_desc:0 "Like version A, for class B engines (15 IC per engine)."
 zv_engine_config_quint_c:0 "Five engines (nose + 2 × wings) — class C"
 zv_engine_config_quint_c_desc:0 "Like version A, for class C engines (18 IC per engine)."
 zv_engine_config_hexa_a:0 "Six engines (3 × wings) — class A"
 zv_engine_config_hexa_a_desc:0 "Me 323, BV 238: huge payload, drag of six nacelles. Advanced large airframe (1942) and later. Thrust factor ×3.6, 6 engines."
 zv_engine_config_hexa_b:0 "Six engines (3 × wings) — class B"
 zv_engine_config_hexa_b_desc:0 "Like version A, for class B engines (15 IC per engine)."
 zv_engine_config_hexa_c:0 "Six engines (3 × wings) — class C"
 zv_engine_config_hexa_c_desc:0 "Like version A, for class C engines (18 IC per engine)."
 zv_engine_config_hexa_d:0 "Six engines (3 × wings) — class D"
 zv_engine_config_hexa_d_desc:0 "Like version A, for class D engines (22 IC per engine)."
 zv_engine_config_twin_nose_a:0 "Twin nose engines (VB 10) — class A"
 zv_engine_config_twin_nose_a_desc:0 "Two engines in the fuselage driving a contra-rotating propeller: the thrust of a twin without nacelle drag, but heavy shafts (weight +4) and difficult cooling. Thrust factor ×1.6, 2 engines."
 zv_engine_config_twin_nose_b:0 "Twin nose engines (VB 10) — class B"
 zv_engine_config_twin_nose_b_desc:0 "Like version A, for class B engines (15 IC per engine)."
 zv_engine_config_twin_nose_c:0 "Twin nose engines (VB 10) — class C"
 zv_engine_config_twin_nose_c_desc:0 "Like version A, for class C engines (18 IC per engine)."
 zv_engine_config_tandem_a:0 "Push-pull tandem (Do 335) — class A"
 zv_engine_config_tandem_a_desc:0 "Tractor and pusher propellers on the centreline: the fastest piston twin; poorly cooled rear engine, long and heavy fuselage. Thrust factor ×1.55, 2 engines."
 zv_engine_config_tandem_b:0 "Push-pull tandem (Do 335) — class B"
 zv_engine_config_tandem_b_desc:0 "Like version A, for class B engines (15 IC per engine)."
 zv_engine_config_tandem_c:0 "Push-pull tandem (Do 335) — class C"
 zv_engine_config_tandem_c_desc:0 "Like version A, for class C engines (18 IC per engine)."
 zv_engine_config_tail_a:0 "Tail engine (pusher) — class A"
 zv_engine_config_tail_a_desc:0 "Saab 21, J7W, Me 163: clear nose for guns and visibility, propeller in the wake (thrust −5%), tricky cooling and pilot bail-out. Thrust factor ×0.95, 1 engine."
 zv_engine_config_tail_b:0 "Tail engine (pusher) — class B"
 zv_engine_config_tail_b_desc:0 "Like version A, for class B engines (15 IC per engine)."
 zv_engine_config_tail_c:0 "Tail engine (pusher) — class C"
 zv_engine_config_tail_c_desc:0 "Like version A, for class C engines (18 IC per engine)."
 zv_engine_config_tail_d:0 "Tail engine (pusher) — class D"
 zv_engine_config_tail_d_desc:0 "Like version A, for class D engines (22 IC per engine)."
 zv_prop_2_metal:0 "2-blade propeller (metal)"
 zv_prop_2_metal_desc:0 "Simpler and lighter, but absorbs less power."
 zv_prop_2_wood:0 "2-blade propeller (wood)"
 zv_prop_2_wood_desc:0 "Fixed pitch, no strategic metal: the cheapest."
 zv_prop_3_wood:0 "3-blade propeller (wood)"
 zv_prop_3_wood_desc:0 "Saves aluminium; wooden blades are more fragile."
 zv_prop_4:0 "4-blade propeller"
 zv_prop_4_desc:0 "For powerful engines (tier III and above): transmits more power."
 zv_prop_5:0 "5-blade propeller"
 zv_prop_5_desc:0 "Late Griffon and Merlin: even more thrust, troublesome torque (agility)."
 zv_prop_variable_pitch:0 "Variable pitch"
 zv_prop_variable_pitch_desc:0 "Good efficiency at take-off as well as in cruise."
 zv_prop_feathering:0 "Feathering (constant speed)"
 zv_prop_feathering_desc:0 "Replaces variable pitch: a hit engine is feathered without slowing the aircraft (reliability). Mostly useful for multi-engine aircraft."
 zv_early_supercharger:0 "Early supercharger"
 zv_early_supercharger_desc:0 "Single-stage mechanical supercharger."
 zv_early_turbocharger:0 "Early turbocharger"
 zv_early_turbocharger_desc:0 "Recovers energy from the exhaust gases: little gain low down, a lot high up; chromium-alloy turbine, heavy and fragile."
 zv_supercharger:0 "Supercharger"
 zv_supercharger_desc:0 "Two-speed supercharger."
 zv_turbocharger:0 "Turbocharger"
 zv_turbocharger_desc:0 "B-17, P-38, P-47: the king of high altitude."
 zv_improved_supercharger:0 "Improved supercharger (intercooler)"
 zv_improved_supercharger_desc:0 "One stage plus an intercooler: cheap and effective."
 zv_two_stage_supercharger:0 "Two-stage supercharger"
 zv_two_stage_supercharger_desc:0 "Merlin 61, the P-51's Merlin: the best mechanical supercharger, heavy and expensive."
 zv_improved_turbocharger:0 "Improved turbocharger (intercooler)"
 zv_improved_turbocharger_desc:0 "B-29, P-47D: high altitude, at the cost of weight and chromium."
 zv_high_octane_fuel_s:0 "High-octane fuel (S)"
 zv_high_octane_fuel_s_desc:0 "100/130 octane fuel: more manifold pressure without detonation."
 zv_high_octane_fuel_m:0 "High-octane fuel (M)"
 zv_high_octane_fuel_m_desc:0 "100/130 octane fuel: more manifold pressure without detonation."
 zv_high_octane_fuel_l:0 "High-octane fuel (L)"
 zv_high_octane_fuel_l_desc:0 "100/130 octane fuel: more manifold pressure without detonation."
 zv_water_injection_s:0 "Water-methanol injection (S)"
 zv_water_injection_s_desc:0 "MW-50: combat emergency power; the tank is always carried."
 zv_water_injection_m:0 "Water-methanol injection (M)"
 zv_water_injection_m_desc:0 "MW-50: combat emergency power; the tank is always carried."
 zv_water_injection_l:0 "Water-methanol injection (L)"
 zv_water_injection_l_desc:0 "MW-50: combat emergency power; the tank is always carried."
 zv_gm1:0 "Nitrous oxide injection (GM-1)"
 zv_gm1_desc:0 "Emergency power at high altitude only; heavy bottles. Small and medium airframes."
 zv_direct_injection:0 "Direct fuel injection"
 zv_direct_injection_desc:0 "DB 601: no cut-out under negative g and better efficiency; complex pumps."
 zv_anti_g_carburettor:0 "Anti-g carburettor"
 zv_anti_g_carburettor_desc:0 "“Miss Shilling's orifice”: a cheap fix for the negative-g cut-out. Exclusive with direct injection."
 zv_wep_s:0 "War emergency power (WEP) (S)"
 zv_wep_s_desc:0 "Five minutes of maximum power in combat, at the cost of engine wear."
 zv_wep_m:0 "War emergency power (WEP) (M)"
 zv_wep_m_desc:0 "Five minutes of maximum power in combat, at the cost of engine wear."
 zv_wep_l:0 "War emergency power (WEP) (L)"
 zv_wep_l_desc:0 "Five minutes of maximum power in combat, at the cost of engine wear."
 zv_radiator_ventral:0 "Ventral radiator"
 zv_radiator_ventral_desc:0 "Meredith effect (P-51): a little speed given back; exposed to fire from below."
 zv_radiator_wing:0 "Wing radiator"
 zv_radiator_wing_desc:0 "Bf 109, Spitfire: clean fuselage, but two circuits to protect."
 zv_radiator_annular:0 "Annular radiator"
 zv_radiator_annular_desc:0 "Fw 190 D, Ju 88: armoured radiator around the nose, compact but heavier."
 zv_air_intake:0 "Air intake"
 zv_air_intake_desc:0 "Intake duct for a jet or pulsejet buried in the rear fuselage: required in the tail-engine layout. Duct losses cost 1 thrust per engine."
 zv_naca_cowling:0 "NACA cowling"
 zv_naca_cowling_desc:0 "Removes much of a radial engine's drag."
 zv_deicing_boots:0 "Pneumatic de-icing boots"
 zv_deicing_boots_desc:0 "Icing is a major cause of accidents: reliability goes up."
 zv_heated_leading_edges:0 "Heated leading edges"
 zv_heated_leading_edges_desc:0 "Hot engine air in the leading edges: no drag."
 zv_auto_extinguisher_s:0 "Automatic fire extinguisher (S)"
 zv_auto_extinguisher_s_desc:0 "Puts out engine fires: fewer aircraft lost after a hit."
 zv_auto_extinguisher_m:0 "Automatic fire extinguisher (M)"
 zv_auto_extinguisher_m_desc:0 "Puts out engine fires: fewer aircraft lost after a hit."
 zv_auto_extinguisher_l:0 "Automatic fire extinguisher (L)"
 zv_auto_extinguisher_l_desc:0 "Puts out engine fires: fewer aircraft lost after a hit."
 zv_rato:0 "RATO take-off rockets"
 zv_rato_desc:0 "Lets a loaded aircraft take off: extra thrust on missions with a payload."
 zv_takeoff_trolley:0 "Jettisonable take-off trolley"
 zv_takeoff_trolley_desc:0 "Me 163: no landing gear to carry, skid landing (accidents). Small airframe."
 zv_fuselage_jug_s:0 "« Jug » fuselage (S)"
 zv_fuselage_jug_s_desc:0 "P-47: big sturdy fuselage with plenty of internal fuel; heavy and clumsy."
 zv_fuselage_jug_m:0 "« Jug » fuselage (M)"
 zv_fuselage_jug_m_desc:0 "P-47: big sturdy fuselage with plenty of internal fuel; heavy and clumsy."
 zv_fuselage_jug_l:0 "« Jug » fuselage (L)"
 zv_fuselage_jug_l_desc:0 "P-47: big sturdy fuselage with plenty of internal fuel; heavy and clumsy."
 zv_fuselage_teardrop_s:0 "Teardrop fuselage (S)"
 zv_fuselage_teardrop_s_desc:0 "Shaped as closely as possible around the engine: speed, but little room for fuel and armour."
 zv_fuselage_teardrop_m:0 "Teardrop fuselage (M)"
 zv_fuselage_teardrop_m_desc:0 "Shaped as closely as possible around the engine: speed, but little room for fuel and armour."
 zv_fuselage_twin_boom_s:0 "Twin-boom fuselage (S)"
 zv_fuselage_twin_boom_s_desc:0 "P-38, Fw 189: central nacelle and two booms, with fuel in the booms; redundant but heavier structure. No dorsal or tail turret."
 zv_fuselage_twin_boom_m:0 "Twin-boom fuselage (M)"
 zv_fuselage_twin_boom_m_desc:0 "P-38, Fw 189: central nacelle and two booms, with fuel in the booms; redundant but heavier structure. No dorsal or tail turret."
 zv_fuselage_flying_wing_s:0 "Flying wing (S)"
 zv_fuselage_flying_wing_s_desc:0 "Ho 229, Northrop: very little drag and plenty of volume, but unstable and not very redundant. Forbids the tail unit and only allows wings of the Advanced category."
 zv_fuselage_flying_wing_m:0 "Flying wing (M)"
 zv_fuselage_flying_wing_m_desc:0 "Ho 229, Northrop: very little drag and plenty of volume, but unstable and not very redundant. Forbids the tail unit and only allows wings of the Advanced category."
 zv_fuselage_flying_wing_l:0 "Flying wing (L)"
 zv_fuselage_flying_wing_l_desc:0 "Ho 229, Northrop: very little drag and plenty of volume, but unstable and not very redundant. Forbids the tail unit and only allows wings of the Advanced category."
 zv_fuselage_flying_boat_m:0 "Flying boat hull (M)"
 zv_fuselage_flying_boat_m_desc:0 "A hull that floats: needs no runway, sees far at sea, but the hull adds drag."
 zv_fuselage_flying_boat_l:0 "Flying boat hull (L)"
 zv_fuselage_flying_boat_l_desc:0 "A hull that floats: needs no runway, sees far at sea, but the hull adds drag."
 zv_wooden_monocoque:0 "Wooden monocoque"
 zv_wooden_monocoque_desc:0 "Mosquito: plywood and balsa. Saves aluminium and IC; glue sensitive to humidity."
 zv_tube_and_fabric:0 "Tube and fabric"
 zv_tube_and_fabric_desc:0 "Hurricane, light aircraft: cheap and easy to repair, but fragile and slow. Forbids armour."
 zv_tail_t:0 "T-tail"
 zv_tail_t_desc:0 "Elevator clear of the propeller slipstream; the fin carries more load."
 zv_tail_twin_boom:0 "Twin-boom tail"
 zv_tail_twin_boom_desc:0 "P-38, Fw 189: redundant structure; clears room for a tail engine. Opens a central slot (camera, sight)."
 zv_tail_twin:0 "Twin tail"
 zv_tail_twin_desc:0 "B-24, Bf 110: clears the field of fire of the rear turrets."
 zv_tail_v:0 "V-tail"
 zv_tail_v_desc:0 "Two surfaces instead of three: less drag, tricky coupled controls."
 zv_tail_cruciform:0 "Cruciform tail"
 zv_tail_cruciform_desc:0 "Control surfaces on the centreline: good authority at high speed, more drag."
 zv_armor_plate_s:0 "Armor plate (S)"
 zv_armor_plate_s_desc:0 "Steel plates behind the pilot and around the engines."
 zv_armor_plate_m:0 "Armor plate (M)"
 zv_armor_plate_m_desc:0 "Steel plates behind the pilot and around the engines."
 zv_armor_plate_l:0 "Armor plate (L)"
 zv_armor_plate_l_desc:0 "Steel plates behind the pilot and around the engines."
 zv_non_strategic_materials_s:0 "Non-strategic materials (S)"
 zv_non_strategic_materials_s_desc:0 "Steel and wood instead of aluminium."
 zv_non_strategic_materials_m:0 "Non-strategic materials (M)"
 zv_non_strategic_materials_m_desc:0 "Steel and wood instead of aluminium."
 zv_non_strategic_materials_l:0 "Non-strategic materials (L)"
 zv_non_strategic_materials_l_desc:0 "Steel and wood instead of aluminium."
 zv_lightweight_construction_s:0 "Lightweight construction (S)"
 zv_lightweight_construction_s_desc:0 "A6M Zero: drilled spars; agility is paid for in defence. The lightened structure cannot bear heavy loads: on attack or bombing missions, the weight saved comes back, plus 1."
 zv_lightweight_construction_m:0 "Lightweight construction (M)"
 zv_lightweight_construction_m_desc:0 "A6M Zero: drilled spars; agility is paid for in defence. The lightened structure cannot bear heavy loads: on attack or bombing missions, the weight saved comes back, plus 1."
 zv_reinforced_construction_s:0 "Reinforced construction (S)"
 zv_reinforced_construction_s_desc:0 "Il-2, Grumman “Iron Works”: oversized structure that soaks up damage."
 zv_reinforced_construction_m:0 "Reinforced construction (M)"
 zv_reinforced_construction_m_desc:0 "Il-2, Grumman “Iron Works”: oversized structure that soaks up damage."
 zv_reinforced_construction_l:0 "Reinforced construction (L)"
 zv_reinforced_construction_l_desc:0 "Il-2, Grumman “Iron Works”: oversized structure that soaks up damage."
 zv_combat_flaps_s:0 "Combat flaps (S)"
 zv_combat_flaps_s_desc:0 "Ki-43, P-51: partial deflection in dogfights."
 zv_combat_flaps_m:0 "Combat flaps (M)"
 zv_combat_flaps_m_desc:0 "Ki-43, P-51: partial deflection in dogfights."
 zv_fowler_flaps:0 "Fowler flaps"
 zv_fowler_flaps_desc:0 "Lockheed: high lift at take-off, so more payload carried; mission weight drops by 1."
 zv_leading_edge_slats:0 "Leading-edge slats"
 zv_leading_edge_slats_desc:0 "Bf 109: delayed stall, tighter turns and safer landings."
 zv_dive_brakes_s:0 "Dive brakes (S)"
 zv_dive_brakes_s_desc:0 "Dive bombing: accuracy and a safer pull-out; incompatible with the torpedo."
 zv_dive_brakes_m:0 "Dive brakes (M)"
 zv_dive_brakes_m_desc:0 "Dive bombing: accuracy and a safer pull-out; incompatible with the torpedo."
 zv_aerodynamic_pylons_s:0 "Aerodynamic pylons (S)"
 zv_aerodynamic_pylons_s_desc:0 "Fairing for external loads: gives back part of the agility and speed lost on missions."
 zv_aerodynamic_pylons_m:0 "Aerodynamic pylons (M)"
 zv_aerodynamic_pylons_m_desc:0 "Fairing for external loads: gives back part of the agility and speed lost on missions."
 zv_gear_fixed_tricycle:0 "Fixed tricycle gear"
 zv_gear_fixed_tricycle_desc:0 "Much safer taxiing and landing, without the speed gain of retractable gear."
 zv_gear_retractable_taildragger:0 "Retractable taildragger gear"
 zv_gear_retractable_taildragger_desc:0 "The clearest speed gain of the interwar years; a mechanism that breaks (Bf 109, Spitfire)."
 zv_gear_retractable_tricycle:0 "Retractable tricycle gear"
 zv_gear_retractable_tricycle_desc:0 "P-39, B-24, Me 262: retractable gear plus the safety of the tricycle layout."
 zv_floats:0 "Floats"
 zv_floats_desc:0 "Floatplane: needs no runway."
 zv_skis:0 "Skis"
 zv_skis_desc:0 "Snowy airfields: less breakage on landing, more drag."
 zv_carrier_equipment:0 "Arrestor hook and folding wings"
 zv_carrier_equipment_desc:0 "Reproduces the vanilla gap between the small airframe and the carrier airframe (−5 agility, +1 weight, +2 to +4.5 IC). Small airframe."
