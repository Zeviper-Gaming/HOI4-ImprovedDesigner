 zv_cockpit_open:0 "Open cockpit"
 zv_cockpit_open_desc:0 "Biplanes, early I-16: cheap, but drag and an exposed pilot."
 zv_cockpit_pressurized:0 "Pressurized cockpit"
 zv_cockpit_pressurized_desc:0 "B-29, Spitfire HF: operates above the flak and enemy fighters."
 zv_cockpit_bubble:0 "Bubble canopy"
 zv_cockpit_bubble_desc:0 "All-round visibility: you see the enemy first and are surprised less often."
 zv_cockpit_glazed_nose:0 "Glazed bomber nose"
 zv_cockpit_glazed_nose_desc:0 "He 111, B-17: bomb aimer's station; nose without engine or gun, poorly protected."
 zv_armored_cockpit:0 "Armored glass and seat"
 zv_armored_cockpit_desc:0 "Protects the pilot, and so the aircraft: fixed defence, whatever the size."
 zv_ejection_seat:0 "Ejection seat"
 zv_ejection_seat_desc:0 "He 219: crew survival is not a game stat; it is rendered as air combat defence, for lack of anything better (abstraction)."
 zv_fuel_tanks_s:0 "Extra fuel tanks (S)"
 zv_fuel_tanks_s_desc:0 "More fuel, more flammable surface."
 zv_fuel_tanks_m:0 "Extra fuel tanks (M)"
 zv_fuel_tanks_m_desc:0 "More fuel, more flammable surface."
 zv_fuel_tanks_l:0 "Extra fuel tanks (L)"
 zv_fuel_tanks_l_desc:0 "More fuel, more flammable surface."
 zv_self_sealing_fuel_tanks_s:0 "Self-sealing fuel tanks (S)"
 zv_self_sealing_fuel_tanks_s_desc:0 "The rubber that seals holes takes up room: −5% range."
 zv_self_sealing_fuel_tanks_m:0 "Self-sealing fuel tanks (M)"
 zv_self_sealing_fuel_tanks_m_desc:0 "The rubber that seals holes takes up room: −5% range."
 zv_self_sealing_fuel_tanks_l:0 "Self-sealing fuel tanks (L)"
 zv_self_sealing_fuel_tanks_l_desc:0 "The rubber that seals holes takes up room: −5% range."
 zv_drop_tanks_s:0 "Drop tanks (S)"
 zv_drop_tanks_s_desc:0 "Dropped before combat; their weight still counts (engine limit)."
