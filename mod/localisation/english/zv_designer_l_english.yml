 zv_engine_inline_1:0 "En ligne I"
 zv_engine_inline_1_desc:0 "Moins puissant que le V, mais plus léger, plus fin et moins cher : il garde un peu d'agilité."
 zv_engine_config_nose_a:0 "Moteur de nez simple — classe A"
 zv_engine_config_nose_a_desc:0 "Référence : le monomoteur vanilla. Facteur de poussée ×1,0, 1 moteur."
 zv_engine_config_twin_wing_a:0 "Bimoteur (ailes) — classe A"
 zv_engine_config_twin_wing_a_desc:0 "Bf 110, He 111, Me 262, P-38. Un moteur peut lâcher sans perdre l'avion (fiabilité). Libre sur petite cellule : il n'y a pas de fuselage bimoteur. Facteur de poussée ×1,55, 2 moteurs."
 zv_role_fighter_small:0 "Chasseur (P)"
 zv_role_fighter_small_desc:0 "Aucune stat de rôle."
 zv_light_mg_2x:0 "Mitrailleuses légères x2"
 zv_light_mg_2x_desc:0 "7,5 à 7,92 mm : légères, faible pouvoir d'arrêt."
 zv_engine_v_1:0 "En V I"
 zv_engine_v_1_desc:0 "Le plus puissant des moteurs à pistons et le plus profilé ; circuit de glycol vulnérable et mécanique délicate."
 zv_engine_v_2:0 "En V II"
 zv_engine_v_2_desc:0 "Le plus puissant des moteurs à pistons et le plus profilé ; circuit de glycol vulnérable et mécanique délicate."
 zv_engine_v_3:0 "En V III"
 zv_engine_v_3_desc:0 "Le plus puissant des moteurs à pistons et le plus profilé ; circuit de glycol vulnérable et mécanique délicate."
 zv_engine_v_4:0 "En V IV"
 zv_engine_v_4_desc:0 "Le plus puissant des moteurs à pistons et le plus profilé ; circuit de glycol vulnérable et mécanique délicate."
 zv_engine_inline_2:0 "En ligne II"
 zv_engine_inline_2_desc:0 "Moins puissant que le V, mais plus léger, plus fin et moins cher : il garde un peu d'agilité."
 zv_engine_inline_3:0 "En ligne III"
 zv_engine_inline_3_desc:0 "Moins puissant que le V, mais plus léger, plus fin et moins cher : il garde un peu d'agilité."
 zv_engine_inline_4:0 "En ligne IV"
 zv_engine_inline_4_desc:0 "Moins puissant que le V, mais plus léger, plus fin et moins cher : il garde un peu d'agilité."
 zv_engine_radial_1:0 "En étoile I"
 zv_engine_radial_1_desc:0 "Aussi puissant que le V, encaisse les coups (pas de liquide de refroidissement) et tombe rarement en panne ; sa grande section frontale freine l'avion, ce que le carénage NACA compense en partie."
 zv_engine_radial_2:0 "En étoile II"
 zv_engine_radial_2_desc:0 "Aussi puissant que le V, encaisse les coups (pas de liquide de refroidissement) et tombe rarement en panne ; sa grande section frontale freine l'avion, ce que le carénage NACA compense en partie."
 zv_engine_radial_3:0 "En étoile III"
 zv_engine_radial_3_desc:0 "Aussi puissant que le V, encaisse les coups (pas de liquide de refroidissement) et tombe rarement en panne ; sa grande section frontale freine l'avion, ce que le carénage NACA compense en partie."
 zv_engine_radial_4:0 "En étoile IV"
 zv_engine_radial_4_desc:0 "Aussi puissant que le V, encaisse les coups (pas de liquide de refroidissement) et tombe rarement en panne ; sa grande section frontale freine l'avion, ce que le carénage NACA compense en partie."
 zv_engine_rotary_1:0 "Rotatif I"
 zv_engine_rotary_1_desc:0 "Léger et nerveux, mais le carter qui tourne avec l'hélice limite le régime : la poussée plafonne vers 14 et le graissage à huile perdue fait chuter la fiabilité. Branche impasse, gardée pour qui veut la jouer."
 zv_engine_rotary_2:0 "Rotatif II"
 zv_engine_rotary_2_desc:0 "Léger et nerveux, mais le carter qui tourne avec l'hélice limite le régime : la poussée plafonne vers 14 et le graissage à huile perdue fait chuter la fiabilité. Branche impasse, gardée pour qui veut la jouer."
 zv_engine_rotary_3:0 "Rotatif III"
 zv_engine_rotary_3_desc:0 "Léger et nerveux, mais le carter qui tourne avec l'hélice limite le régime : la poussée plafonne vers 14 et le graissage à huile perdue fait chuter la fiabilité. Branche impasse, gardée pour qui veut la jouer."
 zv_engine_rotary_4:0 "Rotatif IV"
 zv_engine_rotary_4_desc:0 "Léger et nerveux, mais le carter qui tourne avec l'hélice limite le régime : la poussée plafonne vers 14 et le graissage à huile perdue fait chuter la fiabilité. Branche impasse, gardée pour qui veut la jouer."
 zv_engine_flat_1:0 "À plat I (petite cylindrée)"
 zv_engine_flat_1_desc:0 "Moteur d'avion léger (liaison, entraînement) : très fiable et économe, trop faible pour un avion de combat."
 zv_engine_flat_2:0 "À plat II (grosse cylindrée)"
 zv_engine_flat_2_desc:0 "Version plus grosse pour les avions d'observation et de liaison tardifs."
 zv_engine_diesel_1:0 "Diesel I (type Jumo 205)"
 zv_engine_diesel_1_desc:0 "Consomme peu et porte loin, mais lourd et faible en altitude."
 zv_engine_diesel_2:0 "Diesel II (altitude, type Jumo 207)"
 zv_engine_diesel_2_desc:0 "Diesel suralimenté pour la reconnaissance à haute altitude (Ju 86P)."
 zv_engine_pulsejet:0 "Pulsoréacteur (type Argus)"
 zv_engine_pulsejet_desc:0 "Simple et bon marché, mais il vibre, consomme énormément et ne pousse bien qu'à grande vitesse. Branche impasse."
 zv_engine_centrifugal_1:0 "Turboréacteur centrifuge I (type Whittle)"
 zv_engine_centrifugal_1_desc:0 "Premier réacteur (Meteor F.1) : pas plus rapide qu'un bon moteur à pistons de 1944, gourmand et fragile ; il ouvre la voie aux réacteurs suivants."
 zv_engine_centrifugal_2:0 "Turboréacteur centrifuge II"
 zv_engine_centrifugal_2_desc:0 "Centrifuge mûr (Nene, Derwent V) : fiable pour un réacteur, mais large."
 zv_engine_axial_1:0 "Turboréacteur axial I (type Jumo 004)"
 zv_engine_axial_1_desc:0 "Fin et rapide, mais sa durée de vie très courte et ses alliages réfractaires (chrome) le rendent peu fiable et cher en ressources."
 zv_engine_axial_2:0 "Turboréacteur axial II (après-guerre)"
 zv_engine_axial_2_desc:0 "Génération d'après-guerre : la meilleure poussée du mod. Technologie lointaine."
 zv_engine_turboprop:0 "Turbopropulseur"
 zv_engine_turboprop_desc:0 "Turbine qui entraîne une hélice : poussée de réacteur, portée presque de moteur à pistons, vitesse intermédiaire. Garde le slot d'hélice. Technologie lointaine."
 zv_engine_rocket_1:0 "Moteur-fusée 1"
 zv_engine_rocket_1_desc:0 "Montée foudroyante pour l'interception seulement ; quelques minutes de propulsion (portée effondrée) et des ergols dangereux (fiabilité). Configurations permises : moteur de queue, bimoteur, quadrimoteur et hexamoteur d'ailes ; pas de prise d'air."
 zv_engine_rocket_2:0 "Moteur-fusée 2"
 zv_engine_rocket_2_desc:0 "Montée foudroyante pour l'interception seulement ; quelques minutes de propulsion (portée effondrée) et des ergols dangereux (fiabilité). Configurations permises : moteur de queue, bimoteur, quadrimoteur et hexamoteur d'ailes ; pas de prise d'air."
 zv_engine_rocket_3:0 "Moteur-fusée 3"
 zv_engine_rocket_3_desc:0 "Montée foudroyante pour l'interception seulement ; quelques minutes de propulsion (portée effondrée) et des ergols dangereux (fiabilité). Configurations permises : moteur de queue, bimoteur, quadrimoteur et hexamoteur d'ailes ; pas de prise d'air."
 zv_engine_config_nose_b:0 "Moteur de nez simple — classe B"
 zv_engine_config_nose_b_desc:0 "Comme la version A, pour les moteurs de classe B (15 IC par moteur)."
 zv_engine_config_nose_c:0 "Moteur de nez simple — classe C"
 zv_engine_config_nose_c_desc:0 "Comme la version A, pour les moteurs de classe C (18 IC par moteur)."
 zv_engine_config_twin_wing_b:0 "Bimoteur (ailes) — classe B"
 zv_engine_config_twin_wing_b_desc:0 "Comme la version A, pour les moteurs de classe B (15 IC par moteur)."
 zv_engine_config_twin_wing_c:0 "Bimoteur (ailes) — classe C"
 zv_engine_config_twin_wing_c_desc:0 "Comme la version A, pour les moteurs de classe C (18 IC par moteur)."
 zv_engine_config_twin_wing_d:0 "Bimoteur (ailes) — classe D"
 zv_engine_config_twin_wing_d_desc:0 "Comme la version A, pour les moteurs de classe D (22 IC par moteur)."
 zv_engine_config_tri_a:0 "Trimoteur (ailes + nez) — classe A"
 zv_engine_config_tri_a_desc:0 "Ju 52, SM.79 : redondant, mais lourd à manier (trois masses moteur) et le moteur de nez prend la place du poste avant. Facteur de poussée ×2,05, 3 moteurs."
 zv_engine_config_tri_b:0 "Trimoteur (ailes + nez) — classe B"
 zv_engine_config_tri_b_desc:0 "Comme la version A, pour les moteurs de classe B (15 IC par moteur)."
 zv_engine_config_tri_c:0 "Trimoteur (ailes + nez) — classe C"
 zv_engine_config_tri_c_desc:0 "Comme la version A, pour les moteurs de classe C (18 IC par moteur)."
 zv_engine_config_quad_a:0 "Quadrimoteur (2 × ailes) — classe A"
 zv_engine_config_quad_a_desc:0 "B-17, Lancaster : la configuration du bombardier lourd. Facteur de poussée ×2,6, 4 moteurs."
 zv_engine_config_quad_b:0 "Quadrimoteur (2 × ailes) — classe B"
 zv_engine_config_quad_b_desc:0 "Comme la version A, pour les moteurs de classe B (15 IC par moteur)."
 zv_engine_config_quad_c:0 "Quadrimoteur (2 × ailes) — classe C"
 zv_engine_config_quad_c_desc:0 "Comme la version A, pour les moteurs de classe C (18 IC par moteur)."
 zv_engine_config_quad_d:0 "Quadrimoteur (2 × ailes) — classe D"
 zv_engine_config_quad_d_desc:0 "Comme la version A, pour les moteurs de classe D (22 IC par moteur)."
 zv_engine_config_quad_tandem_a:0 "Quadrimoteur en tandem (2 par aile, l'un derrière l'autre) — classe A"
 zv_engine_config_quad_tandem_a_desc:0 "Do 26, Do 18 : deux nacelles au lieu de quatre (moins de traînée), mais l'hélice arrière tourne dans le souffle de l'autre (poussée −8 %) et le moteur arrière chauffe. Facteur de poussée ×2,4, 4 moteurs."
 zv_engine_config_quad_tandem_b:0 "Quadrimoteur en tandem (2 par aile, l'un derrière l'autre) — classe B"
 zv_engine_config_quad_tandem_b_desc:0 "Comme la version A, pour les moteurs de classe B (15 IC par moteur)."
 zv_engine_config_quad_tandem_c:0 "Quadrimoteur en tandem (2 par aile, l'un derrière l'autre) — classe C"
 zv_engine_config_quad_tandem_c_desc:0 "Comme la version A, pour les moteurs de classe C (18 IC par moteur)."
 zv_engine_config_quint_a:0 "Pentamoteur (nez + 2 × ailes) — classe A"
 zv_engine_config_quint_a_desc:0 "He 111 Z : rare ; plus de poussée qu'un quadrimoteur, au prix de la traînée et du nez occupé. Facteur de poussée ×3,1, 5 moteurs."
 zv_engine_config_quint_b:0 "Pentamoteur (nez + 2 × ailes) — classe B"
 zv_engine_config_quint_b_desc:0 "Comme la version A, pour les moteurs de classe B (15 IC par moteur)."
 zv_engine_config_quint_c:0 "Pentamoteur (nez + 2 × ailes) — classe C"
 zv_engine_config_quint_c_desc:0 "Comme la version A, pour les moteurs de classe C (18 IC par moteur)."
 zv_engine_config_hexa_a:0 "Hexamoteur (3 × ailes) — classe A"
 zv_engine_config_hexa_a_desc:0 "Me 323, BV 238 : énorme charge, traînée de six nacelles. Grande cellule avancée (1942) et après. Facteur de poussée ×3,6, 6 moteurs."
 zv_engine_config_hexa_b:0 "Hexamoteur (3 × ailes) — classe B"
 zv_engine_config_hexa_b_desc:0 "Comme la version A, pour les moteurs de classe B (15 IC par moteur)."
 zv_engine_config_hexa_c:0 "Hexamoteur (3 × ailes) — classe C"
 zv_engine_config_hexa_c_desc:0 "Comme la version A, pour les moteurs de classe C (18 IC par moteur)."
 zv_engine_config_hexa_d:0 "Hexamoteur (3 × ailes) — classe D"
 zv_engine_config_hexa_d_desc:0 "Comme la version A, pour les moteurs de classe D (22 IC par moteur)."
 zv_engine_config_twin_nose_a:0 "Bimoteur de nez (VB 10) — classe A"
 zv_engine_config_twin_nose_a_desc:0 "Deux moteurs dans le fuselage sur une hélice contrarotative : la poussée d'un bimoteur sans traînée de nacelles, mais arbres lourds (poids +4) et refroidissement difficile. Facteur de poussée ×1,6, 2 moteurs."
 zv_engine_config_twin_nose_b:0 "Bimoteur de nez (VB 10) — classe B"
 zv_engine_config_twin_nose_b_desc:0 "Comme la version A, pour les moteurs de classe B (15 IC par moteur)."
 zv_engine_config_twin_nose_c:0 "Bimoteur de nez (VB 10) — classe C"
 zv_engine_config_twin_nose_c_desc:0 "Comme la version A, pour les moteurs de classe C (18 IC par moteur)."
 zv_engine_config_tandem_a:0 "Tandem nez-queue (Do 335) — classe A"
 zv_engine_config_tandem_a_desc:0 "Hélice tractive et hélice propulsive dans l'axe : le plus rapide des bimoteurs à pistons ; moteur arrière mal refroidi, fuselage long et lourd. Facteur de poussée ×1,55, 2 moteurs."
 zv_engine_config_tandem_b:0 "Tandem nez-queue (Do 335) — classe B"
 zv_engine_config_tandem_b_desc:0 "Comme la version A, pour les moteurs de classe B (15 IC par moteur)."
 zv_engine_config_tandem_c:0 "Tandem nez-queue (Do 335) — classe C"
 zv_engine_config_tandem_c_desc:0 "Comme la version A, pour les moteurs de classe C (18 IC par moteur)."
 zv_engine_config_tail_a:0 "Moteur de queue (propulsif) — classe A"
 zv_engine_config_tail_a_desc:0 "Saab 21, J7W, Me 163 : nez dégagé pour les armes et la vue, hélice dans le sillage (poussée −5 %), refroidissement et évacuation du pilote délicats. Facteur de poussée ×0,95, 1 moteur."
 zv_engine_config_tail_b:0 "Moteur de queue (propulsif) — classe B"
 zv_engine_config_tail_b_desc:0 "Comme la version A, pour les moteurs de classe B (15 IC par moteur)."
 zv_engine_config_tail_c:0 "Moteur de queue (propulsif) — classe C"
 zv_engine_config_tail_c_desc:0 "Comme la version A, pour les moteurs de classe C (18 IC par moteur)."
 zv_engine_config_tail_d:0 "Moteur de queue (propulsif) — classe D"
 zv_engine_config_tail_d_desc:0 "Comme la version A, pour les moteurs de classe D (22 IC par moteur)."
 zv_prop_2_metal:0 "Hélice 2 pales (métal)"
 zv_prop_2_metal_desc:0 "Plus simple et plus légère, mais absorbe moins de puissance."
 zv_prop_2_wood:0 "Hélice 2 pales (bois)"
 zv_prop_2_wood_desc:0 "Pas fixe, sans métal stratégique : la moins chère."
 zv_prop_3_wood:0 "Hélice 3 pales (bois)"
 zv_prop_3_wood_desc:0 "Économise l'aluminium ; pales en bois plus fragiles."
 zv_prop_4:0 "Hélice 4 pales"
 zv_prop_4_desc:0 "Pour les moteurs puissants (palier III et plus) : transmet plus de puissance."
 zv_prop_5:0 "Hélice 5 pales"
 zv_prop_5_desc:0 "Griffon, Merlin tardifs : encore plus de poussée, couple gênant (agilité)."
 zv_prop_variable_pitch:0 "Pas variable"
 zv_prop_variable_pitch_desc:0 "Bon rendement au décollage comme en croisière."
 zv_prop_feathering:0 "Mise en drapeau (vitesse constante)"
 zv_prop_feathering_desc:0 "Remplace le pas variable : un moteur touché se met en drapeau sans freiner l'avion (fiabilité). Surtout utile aux multimoteurs."
 zv_early_supercharger:0 "Compresseur précoce"
 zv_early_supercharger_desc:0 "Compresseur mécanique à un étage."
 zv_early_turbocharger:0 "Turbocompresseur précoce"
 zv_early_turbocharger_desc:0 "Récupère l'énergie des gaz : peu de gain en bas, beaucoup en haut ; turbine en alliage au chrome, lourde et fragile."
 zv_supercharger:0 "Compresseur"
 zv_supercharger_desc:0 "Compresseur à deux vitesses."
 zv_turbocharger:0 "Turbocompresseur"
 zv_turbocharger_desc:0 "B-17, P-38, P-47 : le roi de la haute altitude."
 zv_improved_supercharger:0 "Compresseur amélioré (refroidisseur intermédiaire)"
 zv_improved_supercharger_desc:0 "Un étage plus un refroidisseur intermédiaire : bon marché et efficace."
 zv_two_stage_supercharger:0 "Compresseur à deux étages"
 zv_two_stage_supercharger_desc:0 "Merlin 61, Merlin du P-51 : le meilleur compresseur mécanique, lourd et cher."
 zv_improved_turbocharger:0 "Turbocompresseur amélioré (refroidisseur intermédiaire)"
 zv_improved_turbocharger_desc:0 "B-29, P-47D : haute altitude, au prix du poids et du chrome."
 zv_high_octane_fuel_s:0 "Essence à haut indice d'octane (S)"
 zv_high_octane_fuel_s_desc:0 "Essence 100/130 : plus de pression d'admission sans détonation."
 zv_high_octane_fuel_m:0 "Essence à haut indice d'octane (M)"
 zv_high_octane_fuel_m_desc:0 "Essence 100/130 : plus de pression d'admission sans détonation."
 zv_high_octane_fuel_l:0 "Essence à haut indice d'octane (L)"
 zv_high_octane_fuel_l_desc:0 "Essence 100/130 : plus de pression d'admission sans détonation."
 zv_water_injection_s:0 "Injection d'eau-méthanol (S)"
 zv_water_injection_s_desc:0 "MW-50 : surpuissance de combat ; le réservoir pèse en permanence."
 zv_water_injection_m:0 "Injection d'eau-méthanol (M)"
 zv_water_injection_m_desc:0 "MW-50 : surpuissance de combat ; le réservoir pèse en permanence."
 zv_water_injection_l:0 "Injection d'eau-méthanol (L)"
 zv_water_injection_l_desc:0 "MW-50 : surpuissance de combat ; le réservoir pèse en permanence."
 zv_gm1:0 "Injection de protoxyde d'azote (GM-1)"
 zv_gm1_desc:0 "Surpuissance en haute altitude seulement ; bouteilles lourdes. Petites et moyennes cellules."
 zv_direct_injection:0 "Injection directe"
 zv_direct_injection_desc:0 "DB 601 : pas de coupure en g négatif et meilleur rendement ; pompes complexes."
 zv_anti_g_carburettor:0 "Carburateur anti-g"
 zv_anti_g_carburettor_desc:0 "« Orifice de Miss Shilling » : corrige à moindre coût la coupure en g négatif. Exclusif avec l'injection directe."
 zv_wep_s:0 "Régime d'urgence WEP (S)"
 zv_wep_s_desc:0 "Cinq minutes de puissance maximale en combat, au prix de l'usure du moteur."
 zv_wep_m:0 "Régime d'urgence WEP (M)"
 zv_wep_m_desc:0 "Cinq minutes de puissance maximale en combat, au prix de l'usure du moteur."
 zv_wep_l:0 "Régime d'urgence WEP (L)"
 zv_wep_l_desc:0 "Cinq minutes de puissance maximale en combat, au prix de l'usure du moteur."
 zv_radiator_ventral:0 "Radiateur ventral"
 zv_radiator_ventral_desc:0 "Effet Meredith (P-51) : un peu de vitesse rendue ; exposé aux tirs par-dessous."
 zv_radiator_wing:0 "Radiateur dans l'aile"
 zv_radiator_wing_desc:0 "Bf 109, Spitfire : fuselage propre, mais deux circuits à protéger."
 zv_radiator_annular:0 "Radiateur annulaire"
 zv_radiator_annular_desc:0 "Fw 190 D, Ju 88 : radiateur blindé autour du nez, compact mais plus lourd."
 zv_air_intake:0 "Prise d'air"
 zv_air_intake_desc:0 "Conduit d'alimentation d'un réacteur ou d'un pulsoréacteur enfoui à l'arrière : obligatoire en configuration moteur de queue (décision de l'inventaire). Les pertes du conduit coûtent 1 de poussée par moteur. Débloquée par `engines_2`, prérequis commun du pulsoréacteur et des turboréacteurs."
 zv_naca_cowling:0 "Carénage NACA"
 zv_naca_cowling_desc:0 "Supprime une grande partie de la traînée d'un moteur en étoile."
 zv_deicing_boots:0 "Bottes pneumatiques"
 zv_deicing_boots_desc:0 "Le givre est une cause majeure d'accident : la fiabilité monte."
 zv_heated_leading_edges:0 "Bords d'attaque chauffés"
 zv_heated_leading_edges_desc:0 "Air chaud des moteurs dans les bords d'attaque : sans traînée."
 zv_auto_extinguisher_s:0 "Extincteur automatique (S)"
 zv_auto_extinguisher_s_desc:0 "Éteint les feux de moteur : moins d'avions perdus après un coup au but."
 zv_auto_extinguisher_m:0 "Extincteur automatique (M)"
 zv_auto_extinguisher_m_desc:0 "Éteint les feux de moteur : moins d'avions perdus après un coup au but."
 zv_auto_extinguisher_l:0 "Extincteur automatique (L)"
 zv_auto_extinguisher_l_desc:0 "Éteint les feux de moteur : moins d'avions perdus après un coup au but."
 zv_rato:0 "Fusées de décollage RATO"
 zv_rato_desc:0 "Permet de décoller chargé : de la poussée en plus dans les missions avec charge."
 zv_takeoff_trolley:0 "Chariot largable"
 zv_takeoff_trolley_desc:0 "Me 163 : pas de train à porter, atterrissage sur patin (accidents). Petite cellule."
 zv_fuselage_jug_s:0 "Fuselage « Jug » (S)"
 zv_fuselage_jug_s_desc:0 "P-47 : gros fuselage robuste avec beaucoup de carburant interne ; lourd et pataud."
 zv_fuselage_jug_m:0 "Fuselage « Jug » (M)"
 zv_fuselage_jug_m_desc:0 "P-47 : gros fuselage robuste avec beaucoup de carburant interne ; lourd et pataud."
 zv_fuselage_jug_l:0 "Fuselage « Jug » (L)"
 zv_fuselage_jug_l_desc:0 "P-47 : gros fuselage robuste avec beaucoup de carburant interne ; lourd et pataud."
 zv_fuselage_teardrop_s:0 "Fuselage goutte (S)"
 zv_fuselage_teardrop_s_desc:0 "Profilé au plus près du moteur : vitesse, mais peu de place pour le carburant et le blindage."
 zv_fuselage_teardrop_m:0 "Fuselage goutte (M)"
 zv_fuselage_teardrop_m_desc:0 "Profilé au plus près du moteur : vitesse, mais peu de place pour le carburant et le blindage."
 zv_fuselage_twin_boom_s:0 "Fuselage bipoutre (S)"
 zv_fuselage_twin_boom_s_desc:0 "P-38, Fw 189 : nacelle centrale et deux poutres, avec du carburant dans les poutres ; structure redondante mais plus lourde. Pas de tourelle de dos ni de queue."
 zv_fuselage_twin_boom_m:0 "Fuselage bipoutre (M)"
 zv_fuselage_twin_boom_m_desc:0 "P-38, Fw 189 : nacelle centrale et deux poutres, avec du carburant dans les poutres ; structure redondante mais plus lourde. Pas de tourelle de dos ni de queue."
 zv_fuselage_flying_wing_s:0 "Aile volante (S)"
 zv_fuselage_flying_wing_s_desc:0 "Ho 229, Northrop : très peu de traînée et beaucoup de volume, mais instable et peu redondante. Interdit l'empennage et n'ouvre que les ailes de la catégorie Avancée."
 zv_fuselage_flying_wing_m:0 "Aile volante (M)"
 zv_fuselage_flying_wing_m_desc:0 "Ho 229, Northrop : très peu de traînée et beaucoup de volume, mais instable et peu redondante. Interdit l'empennage et n'ouvre que les ailes de la catégorie Avancée."
 zv_fuselage_flying_wing_l:0 "Aile volante (L)"
 zv_fuselage_flying_wing_l_desc:0 "Ho 229, Northrop : très peu de traînée et beaucoup de volume, mais instable et peu redondante. Interdit l'empennage et n'ouvre que les ailes de la catégorie Avancée."
 zv_fuselage_flying_boat_m:0 "Hydravion à coque (M)"
 zv_fuselage_flying_boat_m_desc:0 "Coque qui flotte : se passe de piste, voit loin sur mer, mais la coque freine. Valeurs vanilla.<br>*vanilla : flying_boat_medium / flying_boat_large*"
 zv_fuselage_flying_boat_l:0 "Hydravion à coque (L)"
 zv_fuselage_flying_boat_l_desc:0 "Coque qui flotte : se passe de piste, voit loin sur mer, mais la coque freine. Valeurs vanilla.<br>*vanilla : flying_boat_medium / flying_boat_large*"
 zv_wooden_monocoque:0 "Bois monocoque"
 zv_wooden_monocoque_desc:0 "Mosquito : contreplaqué et balsa. Économise l'aluminium et l'IC ; colle sensible à l'humidité."
 zv_tube_and_fabric:0 "Tubes et toile"
 zv_tube_and_fabric_desc:0 "Hurricane, avions légers : bon marché et facile à réparer, mais fragile et lent. Interdit le blindage."
 zv_tail_t:0 "Empennage en T"
 zv_tail_t_desc:0 "Gouverne de profondeur hors du souffle de l'hélice ; dérive plus chargée."
 zv_tail_twin_boom:0 "Double poutre"
 zv_tail_twin_boom_desc:0 "P-38, Fw 189 : structure redondante ; dégage la place d'un moteur de queue. Ouvre un slot central (caméra, viseur)."
 zv_tail_twin:0 "Double dérive"
 zv_tail_twin_desc:0 "B-24, Bf 110 : dégage le champ de tir des tourelles arrière."
 zv_tail_v:0 "Empennage en V"
 zv_tail_v_desc:0 "Deux surfaces au lieu de trois : moins de traînée, commandes couplées délicates."
 zv_tail_cruciform:0 "Empennage cruciforme"
 zv_tail_cruciform_desc:0 "Gouvernes dans l'axe : bonne autorité à grande vitesse, plus de traînée."
 zv_armor_plate_s:0 "Blindage (S)"
 zv_armor_plate_s_desc:0 "Plaques d'acier derrière le pilote et autour des moteurs.<br>*vanilla : armor_plate_small*"
 zv_armor_plate_m:0 "Blindage (M)"
 zv_armor_plate_m_desc:0 "Plaques d'acier derrière le pilote et autour des moteurs.<br>*vanilla : armor_plate_medium*"
 zv_armor_plate_l:0 "Blindage (L)"
 zv_armor_plate_l_desc:0 "Plaques d'acier derrière le pilote et autour des moteurs.<br>*vanilla : armor_plate_large*"
 zv_non_strategic_materials_s:0 "Matériaux non stratégiques (S)"
 zv_non_strategic_materials_s_desc:0 "Acier et bois à la place de l'aluminium.<br>*vanilla : non_strategic_materials_small*"
 zv_non_strategic_materials_m:0 "Matériaux non stratégiques (M)"
 zv_non_strategic_materials_m_desc:0 "Acier et bois à la place de l'aluminium.<br>*vanilla : non_strategic_materials_medium*"
 zv_non_strategic_materials_l:0 "Matériaux non stratégiques (L)"
 zv_non_strategic_materials_l_desc:0 "Acier et bois à la place de l'aluminium.<br>*vanilla : non_strategic_materials_large*"
 zv_lightweight_construction_s:0 "Construction allégée (S)"
 zv_lightweight_construction_s_desc:0 "A6M Zero : longerons percés ; l'agilité est payée en défense. La structure allégée ne supporte pas les lourdes charges : en mission d'attaque ou de bombardement, le poids économisé revient, plus 1."
 zv_lightweight_construction_m:0 "Construction allégée (M)"
 zv_lightweight_construction_m_desc:0 "A6M Zero : longerons percés ; l'agilité est payée en défense. La structure allégée ne supporte pas les lourdes charges : en mission d'attaque ou de bombardement, le poids économisé revient, plus 1."
 zv_reinforced_construction_s:0 "Construction renforcée (S)"
 zv_reinforced_construction_s_desc:0 "Il-2, Grumman « Iron Works » : structure surdimensionnée qui encaisse."
 zv_reinforced_construction_m:0 "Construction renforcée (M)"
 zv_reinforced_construction_m_desc:0 "Il-2, Grumman « Iron Works » : structure surdimensionnée qui encaisse."
 zv_reinforced_construction_l:0 "Construction renforcée (L)"
 zv_reinforced_construction_l_desc:0 "Il-2, Grumman « Iron Works » : structure surdimensionnée qui encaisse."
 zv_combat_flaps_s:0 "Volets de combat (S)"
 zv_combat_flaps_s_desc:0 "Ki-43, P-51 : braquage partiel en combat tournoyant."
 zv_combat_flaps_m:0 "Volets de combat (M)"
 zv_combat_flaps_m_desc:0 "Ki-43, P-51 : braquage partiel en combat tournoyant."
 zv_fowler_flaps:0 "Volets Fowler"
 zv_fowler_flaps_desc:0 "Lockheed : grande portance au décollage, donc plus de charge emportée ; le poids de mission diminue de 1."
 zv_leading_edge_slats:0 "Becs de bord d'attaque"
 zv_leading_edge_slats_desc:0 "Bf 109 : décrochage retardé, virage serré et atterrissage plus sûr."
 zv_dive_brakes_s:0 "Aérofreins (S)"
 zv_dive_brakes_s_desc:0 "Bombardement en piqué : précision et sortie de piqué plus sûre ; incompatible avec la torpille.<br>*vanilla : dive_brakes_small (valeurs reprises)*"
 zv_dive_brakes_m:0 "Aérofreins (M)"
 zv_dive_brakes_m_desc:0 "Bombardement en piqué : précision et sortie de piqué plus sûre ; incompatible avec la torpille.<br>*vanilla : dive_brakes_small (valeurs reprises)*"
 zv_aerodynamic_pylons_s:0 "Pylônes aérodynamiques (S)"
 zv_aerodynamic_pylons_s_desc:0 "Carénage des charges externes : rend une partie de l'agilité et de la vitesse perdues en mission."
 zv_aerodynamic_pylons_m:0 "Pylônes aérodynamiques (M)"
 zv_aerodynamic_pylons_m_desc:0 "Carénage des charges externes : rend une partie de l'agilité et de la vitesse perdues en mission."
 zv_gear_fixed_tricycle:0 "Train fixe tricycle"
 zv_gear_fixed_tricycle_desc:0 "Roulage et atterrissage bien plus sûrs, sans le gain de vitesse du train rentrant."
 zv_gear_retractable_taildragger:0 "Train rétractable à roulette de queue"
 zv_gear_retractable_taildragger_desc:0 "Le gain de vitesse le plus net de l'entre-deux-guerres ; mécanisme qui casse (Bf 109, Spitfire)."
 zv_gear_retractable_tricycle:0 "Train rétractable tricycle"
 zv_gear_retractable_tricycle_desc:0 "P-39, B-24, Me 262 : le train rentrant et la sécurité du tricycle."
 zv_floats:0 "Flotteurs"
 zv_floats_desc:0 "Hydravion à flotteurs : se passe de piste. Valeurs vanilla.<br>*vanilla : floats*"
 zv_skis:0 "Skis"
 zv_skis_desc:0 "Terrains enneigés : moins de casse à l'atterrissage, plus de traînée."
 zv_carrier_equipment:0 "Crosse d'appontage et ailes repliables"
 zv_carrier_equipment_desc:0 "Reprend l'écart vanilla entre petite cellule et cellule embarquée (−5 d'agilité, +1 de poids, +2 à +4,5 IC). Petite cellule."
